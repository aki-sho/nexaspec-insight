<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>NexaSpec Insight</title>
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-overview" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z M9 21v-8h6v8"/>
    </symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>
      <rect x="10" y="10" width="4" height="4" rx=".5"/>
    </symbol>
    <symbol id="icon-mainboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </symbol>
    <symbol id="icon-memory" viewBox="0 0 24 24">
      <rect x="2" y="6" width="20" height="11" rx="1.5"/><path d="M6 9v5m4-5v5m4-5v5m4-5v5M6 17v3m4-3v3m4-3v3m4-3v3"/>
    </symbol>
    <symbol id="icon-graphics" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="11" cy="12" r="4"/><path d="M17 9h1m-1 6h1M6 19v2m12-2v2"/>
    </symbol>
    <symbol id="icon-storage" viewBox="0 0 24 24">
      <rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 13h18M6 16h.1m3.5 0h.1"/>
    </symbol>
    <symbol id="icon-os" viewBox="0 0 24 24">
      <path d="m3 5 18-2v18L3 19z M11 4v16M3 12h18"/>
    </symbol>
    <symbol id="icon-about" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 0 0-14-5L3 9m0-5v5h5m-4 4a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M4 4h13l3 3v13H4z M8 4v6h8V4M8 20v-6h8v6"/>
    </symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="./assets/nexaspec-insight.png" width="44" height="44" alt="" />
        <span>NexaSpec<br />Insight</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="スペック項目" aria-orientation="vertical">
        <button id="tab-All" class="tab active" role="tab" type="button" aria-selected="true" aria-controls="spec-panel" data-tab="All"><svg class="icon" aria-hidden="true"><use href="#icon-overview"/></svg>概要</button>
        <button id="tab-CPU" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="CPU"><svg class="icon" aria-hidden="true"><use href="#icon-cpu"/></svg>CPU</button>
        <button id="tab-Mainboard" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Mainboard"><svg class="icon" aria-hidden="true"><use href="#icon-mainboard"/></svg>マザーボード</button>
        <button id="tab-Memory" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Memory"><svg class="icon" aria-hidden="true"><use href="#icon-memory"/></svg>メモリ</button>
        <button id="tab-Graphics" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Graphics"><svg class="icon" aria-hidden="true"><use href="#icon-graphics"/></svg>グラフィックス</button>
        <button id="tab-Storage" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Storage"><svg class="icon" aria-hidden="true"><use href="#icon-storage"/></svg>ストレージ</button>
        <button id="tab-OS" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="OS"><svg class="icon" aria-hidden="true"><use href="#icon-os"/></svg>OS</button>
        <button id="tab-About" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="About"><svg class="icon" aria-hidden="true"><use href="#icon-about"/></svg>About</button>
      </nav>
      <div class="sidebar-bottom"><span>Windows 10 / 11</span><span id="app-version"></span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <h1 id="page-title">システム概要</h1>
          <time id="last-updated" hidden></time>
        </div>
        <div class="toolbar">
          <span class="system-status" data-state="idle"><span class="local-dot" aria-hidden="true"></span><span id="system-state">未取得</span></span>
          <button id="retry-failed" class="button" type="button" hidden>失敗項目を再試行</button>
          <button id="refresh" class="button primary" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg><span id="refresh-label">すべて更新</span></button>
        </div>
      </header>
      <main class="content">
        <section id="spec-panel" class="panel" role="tabpanel" aria-labelledby="tab-All" tabindex="0"><p>読み込み中です…</p></section>
      </main>
      <footer class="export-bar" aria-label="スペックの出力">
        <label class="serial-option"><input id="include-serial" class="export-control" type="checkbox" />シリアル番号を含める</label>
        <div class="export-actions">
          <button id="copy" class="button export-control" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg>一覧をコピー</button>
          <select id="export-format" class="export-control" aria-label="保存形式"><option value="txt">TXT</option><option value="json">JSON</option></select>
          <button id="save" class="button primary export-control" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-save"/></svg>ファイルに保存</button>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite">PCの情報を取得します。</p>
      </footer>
    </div>
  </div>
  <script type="module" src="./renderer/app.js"></script>
</body>
</html>
