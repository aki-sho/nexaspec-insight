<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>PC Spec Tool</title>
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">P<span>·</span></span>PC SPEC</div>
      <nav class="tabs" role="tablist" aria-label="スペック項目" aria-orientation="vertical">
        <button id="tab-All" class="tab active" role="tab" type="button" aria-selected="true" aria-controls="spec-panel" data-tab="All">すべて</button>
        <button id="tab-CPU" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="CPU">CPU</button>
        <button id="tab-Mainboard" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Mainboard">Mainboard</button>
        <button id="tab-Memory" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Memory">Memory</button>
        <button id="tab-Graphics" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Graphics">Graphics</button>
        <button id="tab-Storage" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="Storage">Storage</button>
        <button id="tab-OS" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="OS">OS</button>
        <button id="tab-About" class="tab" role="tab" type="button" aria-selected="false" aria-controls="spec-panel" tabindex="-1" data-tab="About">About</button>
      </nav>
      <div class="sidebar-bottom" id="app-version"></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <h1>PCスペック</h1>
          <span id="last-updated" class="muted" hidden></span>
        </div>
        <div class="toolbar">
          <span class="system-status"><span class="local-dot" aria-hidden="true"></span><span id="system-state">未取得</span></span>
          <button id="retry-failed" class="button" type="button" hidden>失敗項目を再試行</button>
          <button id="refresh" class="button primary" type="button">すべて更新</button>
        </div>
      </header>
      <main class="content">
        <div class="summary-strip" aria-label="スペック概要">
          <div class="summary-item"><span>CPU</span><strong id="summary-cpu">—</strong></div>
          <div class="summary-item"><span>メモリ</span><strong id="summary-memory">—</strong></div>
          <div class="summary-item"><span>GPU</span><strong id="summary-graphics">—</strong></div>
          <div class="summary-item"><span>ストレージ</span><strong id="summary-storage">—</strong></div>
        </div>
        <section id="spec-panel" class="panel" role="tabpanel" aria-labelledby="tab-All" tabindex="0"><h2>すべて</h2><p>読み込み中です…</p></section>
      </main>
      <footer class="export-bar" aria-label="スペックの出力">
        <label class="serial-option"><input id="include-serial" class="export-control" type="checkbox" />シリアル番号を含める</label>
        <div class="export-actions">
          <button id="copy" class="button export-control" type="button">一覧をコピー</button>
          <select id="export-format" class="export-control" aria-label="保存形式"><option value="txt">TXT</option><option value="json">JSON</option></select>
          <button id="save" class="button accent export-control" type="button">ファイルに保存</button>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite">PCの情報を取得します。</p>
      </footer>
    </div>
  </div>
  <script type="module" src="./renderer/app.js"></script>
</body>
</html>
